name: CI

# Build on every push and pull request to master; deploy only on push to master.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write # needed to push the built site to the deploy branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # react-static 5 / webpack 3 do not run on current Node releases
      # (they rely on process.binding('http_parser')), so pin Node 16.
      - name: Set up Node 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # node-sass is aliased to dart-sass in package.json, which trips
      # sass-loader 6's peer dependency check; --legacy-peer-deps accepts it.
      - name: Install and Build 🔧
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: new-gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
